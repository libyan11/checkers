<script>
(() => {
'use strict';

/* ================= constants & helpers ================= */
const N = 8;
const BOT_NAMES = { easy: 'Computer', medium: 'Computer', hard: 'Computer' };
const LEVEL_NAME = { easy: 'Easy', medium: 'Medium', hard: 'Hard' };
const DEPTH = { easy: 2, medium: 4, hard: 7 };
const MAX_PLAYERS = 2, MIN_PLAYERS = 2;
const COLOR = ['Red', 'Black'];

const LS = (() => { try { return window.localStorage; } catch (e) { return null; } })();
const SS = (() => { try { return window.sessionStorage; } catch (e) { return null; } })();
function getItem(st, k) { try { const v = st && st.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function setItem(st, k, v) { try { if (!st) return; if (v == null) st.removeItem(k); else st.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } }

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const rid = () => Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 6);

const me = (() => { let id = getItem(SS, 'ck-id'); if (!id) { id = rid(); setItem(SS, 'ck-id', id); } return id; })();
let myName = getItem(LS, 'ck-name') || '';
const onlineOK = !/claude|anthropic/i.test(location.hostname) && location.protocol !== 'data:';

let role = null;      // 'solo' | 'host' | 'guest' | null
let roomCode = '';
let S = null;         // full game state (solo and host only)
let V = null;         // what this screen shows
let timer = null, token = 0;
let animSeq = 0, animInit = false, sel = null;
let homeMsg = '', homeErr = false;

/* ---- pure rules: 64 squares, index r*8+c, row 0 at the top. 0 empty, 1 red man, 2 red king, 3 black man, 4 black king.
   Red starts at the bottom and moves up. Captures are compulsory; a jump continues while it can, and a man that reaches the far row is crowned and stops. ---- */
const own = v => v === 0 ? -1 : v <= 2 ? 0 : 1;
const isKing = v => v === 2 || v === 4;
const ALL_DIRS = [[-1, -1], [-1, 1], [1, -1], [1, 1]];
function startBoard() { const b = Array(64).fill(0); for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) { if ((r + c) % 2 !== 1) continue; if (r < 3) b[r * N + c] = 3; else if (r > 4) b[r * N + c] = 1; } return b; }
function dirsFor(v) { if (isKing(v)) return ALL_DIRS; return own(v) === 0 ? [[-1, -1], [-1, 1]] : [[1, -1], [1, 1]]; }
const crownRow = p => p === 0 ? 0 : N - 1;
function pieceCount(b, p) { let n = 0; for (const v of b) if (own(v) === p) n++; return n; }
function legalMoves(b, p) {
  const caps = [], plain = [];
  for (let i = 0; i < 64; i++) {
    const v = b[i];
    if (own(v) !== p) continue;
    const jump = (pos, path, taken) => {
      let more = false;
      const pr = pos >> 3, pc = pos & 7;
      for (const [dr, dc] of dirsFor(v)) {
        const lr = pr + 2 * dr, lc = pc + 2 * dc;
        if (lr < 0 || lr >= N || lc < 0 || lc >= N) continue;
        const m = (pr + dr) * N + pc + dc, l = lr * N + lc;
        if (own(b[m]) !== 1 - p || taken.includes(m) || (b[l] !== 0 && l !== i)) continue;
        more = true;
        const np = path.concat(l), nt = taken.concat(m);
        if (!isKing(v) && lr === crownRow(p)) caps.push({ f: i, path: np, caps: nt });
        else jump(l, np, nt);
      }
      if (!more && path.length) caps.push({ f: i, path, caps: taken });

/* host-side handling of every player's actions */

/* nothing is hidden in this game, so everyone sees the same board */

/* ================= networking (host-authoritative rooms) =================

/* ---- guest ---- */

/* ---- shared ---- */

/* ================= rendering ================= */

function render() {
  const screen = !role || (role === 'guest' && !V) ? 'home' : V && V.phase === 'lobby' ? 'lobby' : 'game';
  if (screen !== 'game') { document.title = 'Checkers · Game Night'; wasMyTurn = false; if (screen === 'home' && wakeLock) { try { wakeLock.release(); } catch (e) { /* skip */ } wakeLock = null; } }
  $('home').hidden = screen !== 'home';
  $('lobby').hidden = screen !== 'lobby';
  $('app').hidden = screen !== 'game';
  if (screen === 'home') renderHome();
  else if (screen === 'lobby') renderLobby();
  else renderGame();
}

function renderNet() {
  const el = $('net');
  el.textContent = role === 'host' || role === 'guest' ? `· Room ${roomCode} · ${netText}` : '';
  el.className = 'net' + (netWarn ? ' warn' : '');
  $('lNet').textContent = netText || ' ';
}

function renderHome() {
  if (document.activeElement !== $('hName')) $('hName').value = myName;
  $('onlineBox').hidden = !onlineOK;
  $('onlineNote').hidden = onlineOK;
  const savedHost = getItem(LS, 'ck-host');
  $('hReopen').hidden = !(savedHost && savedHost.code && role !== 'guest');
  if (savedHost && savedHost.code) $('hReopen').textContent = `Reopen your room ${savedHost.code}`;
  const solo = getItem(LS, 'ck-solo');
  $('hContinue').hidden = !(solo && solo.v === 1 && solo.phase !== 'lobby');
  $('hCreate').disabled = $('hJoin').disabled = role === 'guest';
  const m = $('homeMsg');
  m.textContent = homeMsg; m.className = 'msg' + (homeErr ? ' err' : '');
}

function shareLink() { return location.origin + location.pathname + '#' + roomCode; }

function renderLobby() {
  renderNet();
  $('lCode').textContent = roomCode;
  $('lLink').textContent = shareLink();
  $('lCopy').textContent = navigator.share ? 'Share link' : 'Copy link';
  const host = role === 'host';
  const n = V.players.length;
  $('lCount').textContent = `Players (${n} of 2)`;
  $('lPlayers').innerHTML = V.players.map((p, i) => {
    const tag = p.id === V.hostId ? 'Host' : p.bot ? 'Computer' : p.online ? '' : 'Away';
    const rm = host && p.id !== V.hostId ? `<button class="x" type="button" data-remove="${esc(p.id)}" aria-label="Remove ${esc(p.name)}">Remove</button>` : '';
    return `<li><span class="disc-dot p${i}${p.online || p.bot ? '' : ' off'}" aria-hidden="true"></span><span class="nm">${esc(p.name)}${p.id === me ? ' (you)' : ''}</span><span class="note">${tag}</span>${rm}</li>`;
  }).join('') + (V.waiting.length ? `<li><span class="nm note">Waiting: ${esc(V.waiting.join(', '))}</span></li>` : '');
  $('lHost').hidden = !host;
  $('lLevel').value = V.level;
  $('lLevelBox').hidden = !V.players.some(p => p.bot) && n >= 2;
  $('lAddBot').hidden = n >= 2;
  $('lStart').disabled = n < MIN_PLAYERS;
  $('lNote').textContent = host
    ? (n < 2 ? 'Share the code with a friend, or play the computer.' : 'Ready when you are.')
    : 'Waiting for the host to start.';
}

function renderGame() {
  if (!V) return;
  renderNet();
  $('gameNo').textContent = 'Game ' + V.game;
  renderVs();
  renderBoard();
  renderBar();
  turnSignal(); keepAwake();
}

function renderVs() {
  const pl = (i) => {
    const p = V.players[i];
    if (!p) return '<div></div>';
    const turn = V.phase === 'play' && V.turn === i;
    const tag = p.bot ? '<small>CPU</small>' : !p.online ? '<small class="away">AWAY</small>' : i === V.me ? '<small>YOU</small>' : '';
    return `<div class="pl p${i}${i === 1 ? ' right' : ''}${turn ? ' is-turn' : ''}">
      <span class="disc-dot p${i}" aria-hidden="true"></span>
      <div class="pl-text"><div class="pl-name">${esc(p.name)}${tag}</div><div class="pl-sub">${turn ? 'to move' : COLOR[i]} · ${pieceCount(V.board, i)} left${p.bot ? ' · ' + LEVEL_NAME[V.level] : ''}</div></div>
    </div>`;
  };
  const a = V.players[0] ? V.players[0].wins : 0, b = V.players[1] ? V.players[1].wins : 0;
  $('vs').innerHTML = pl(0) + `<div class="score" aria-label="Score ${a} to ${b}">${a}–${b}</div>` + pl(1);
}

function sqName(i) { return 'abcdefgh'[i & 7] + (N - (i >> 3)); }
function renderBoard() {
  const b = V.board, mine = myTurn(), flip = V.me === 1;
  const moves = mine ? legalMoves(b, V.me) : [];
  const from = new Set(moves.map(m => m.f));
  if (sel != null && !from.has(sel)) sel = null;
  if (mine && sel == null && from.size === 1) sel = [...from][0];
  const chosen = moves.filter(m => m.f === sel);
  const dest = new Set(chosen.map(m => m.path[m.path.length - 1]));
  const via = new Set();
  chosen.forEach(m => m.path.slice(0, -1).forEach(x => via.add(x)));
  const L = V.last, trail = new Set();
  if (L) { trail.add(L.f); L.path.forEach(x => trail.add(x)); }
  const fresh = L && L.seq > animSeq && animInit;
  if (!animInit) { animInit = true; animSeq = L ? L.seq : 0; } else if (L) animSeq = Math.max(animSeq, L.seq);
  let html = '';
  for (let k = 0; k < 64; k++) {
    const i = flip ? 63 - k : k, r = i >> 3, c = i & 7, dark = (r + c) % 2 === 1, v = b[i];
    const cls = ['sq'];
    if (dark) cls.push('dark');
    if (dark && trail.has(i)) cls.push('trail');
    if (dest.has(i)) cls.push('dest'); else if (via.has(i)) cls.push('via');
    let pc = '';
    if (v) {
      const pcl = ['pc', 'p' + own(v)];
      if (isKing(v)) pcl.push('king');
      if (from.has(i)) pcl.push('can');
      if (sel === i) pcl.push('sel');
      if (fresh && L.path[L.path.length - 1] === i) pcl.push('moved');
      pc = `<span class="${pcl.join(' ')}"></span>`;
    }
    const active = mine && (from.has(i) || dest.has(i));
    const what = v ? ', ' + COLOR[own(v)].toLowerCase() + (isKing(v) ? ' king' : ' piece') : '';
    html += `<button class="${cls.join(' ')}" type="button" data-i="${i}"${active ? '' : ' disabled'} aria-label="${sqName(i)}${what}${dest.has(i) ? ', move here' : ''}">${pc}</button>`;
  }
  $('board').innerHTML = html;
  $('board').classList.toggle('over', V.phase === 'over');
}

function renderBar() {
  const mp = myPlayer(), cur = V.players[V.turn];
  const mine = myTurn();
  $('bar').classList.toggle('my-turn', mine);
  let status = '', sub = '';
  if (V.phase === 'over') {
    const w = V.result.winner;
    status = w == null ? "It's a draw." : w === V.me ? 'You win!' : `${V.players[w].name} wins.`;
    sub = w == null ? '40 moves each with no capture.' : V.result.how === 'stuck' ? `${COLOR[1 - w]} has no move left.` : `${COLOR[1 - w]} has no pieces left.`;
  } else if (!mp) { status = `${cur.name} to move.`; sub = 'You are watching. You can play when a seat opens.'; }
  else if (mine) { const mv = legalMoves(V.board, V.me); status = mv[0] && mv[0].caps.length ? 'You must capture.' : 'Your move.'; sub = sel == null ? 'Tap a glowing piece, then where it goes.' : 'Tap a gold dot to move there.'; }
  else { status = `${cur.name} to move.`; sub = cur.bot ? 'The computer is thinking.' : !cur.online ? 'Away: the computer moves for them soon.' : 'Waiting for their move.'; }
  $('status').textContent = status;
  $('sub').textContent = sub;
  const canNext = V.phase === 'over' && (isRoomHost() || V.me >= 0);
  $('btnNext').hidden = !canNext;
}

let wasMyTurn = false, wakeLock = null;
function turnSignal() {
  const mine = myTurn();
  document.title = mine ? 'Your move · Checkers' : 'Checkers · Game Night';
  if (mine && !wasMyTurn && role !== 'solo') { try { navigator.vibrate && navigator.vibrate(80); } catch (e) { /* not supported */ } }
  wasMyTurn = mine;
}
function keepAwake() {
  const want = !!(V && V.phase !== 'lobby') && document.visibilityState === 'visible';
  if (want && !wakeLock && navigator.wakeLock) {
    navigator.wakeLock.request('screen').then(l => { wakeLock = l; l.addEventListener('release', () => { wakeLock = null; }); }).catch(() => {});
  } else if (!want && wakeLock) { try { wakeLock.release(); } catch (e) { /* skip */ } wakeLock = null; }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });

/* ================= modals ================= */
function openModal(html) { $('sheet').innerHTML = html; $('modal').hidden = false; const f = $('sheet').querySelector('button, input, select'); if (f) f.focus(); }
function closeModal() { $('modal').hidden = true; $('sheet').innerHTML = ''; }

function openRules() {
  openModal(`<h2>How to <span>play</span></h2>
  <p class="lede">Two players on an 8×8 board, each starting with 12 pieces on the dark squares.</p>
  <ul class="rules">
    <li><b>Moving.</b> Pieces move one square diagonally forward onto an empty dark square.</li>
    <li><b>Capturing.</b> Jump diagonally over an opponent's piece onto the empty square behind it, and that piece is removed. If you can capture, you must.</li>
    <li><b>Multi-jumps.</b> After a jump, keep jumping with the same piece while you can. Small dots show the path; tap the gold dot where it ends.</li>
    <li><b>Kings.</b> A piece that reaches the far side is crowned and can move and capture backwards too. Getting crowned ends that move.</li>
    <li><b>Winning.</b> Take all your opponent's pieces, or leave them with no legal move.</li>
    <li><b>Draw.</b> If 40 moves each go by with only kings moving and nothing captured, the game is a draw.</li>
    <li><b>The computer.</b> Easy makes mistakes, Medium plays sensibly, Hard looks seven moves ahead and further while captures are on.</li>
    <li><b>Online rooms.</b> One phone creates a room and shares the 4-letter code. If your friend drops out, the computer moves for them until they come back.</li>
  </ul>
  <div class="sheet-actions"><button class="btn primary" type="button" data-close>Got it</button></div>`);
}
function openScores() {
  if (!V) return;
  openModal(`<h2>Match <span>score</span></h2>
    <p class="lede">${V.game} game${V.game === 1 ? '' : 's'} played${V.draws ? `, ${V.draws} drawn` : ''}.</p>
    <ol class="order">${V.players.map((p, i) => `<li class="${i === V.me ? 'me-row' : ''}"><span class="disc-dot p${i}"></span><span class="nm">${esc(p.name)}</span><span class="pts">${p.wins}<small>win${p.wins === 1 ? '' : 's'}</small></span></li>`).join('')}</ol>
    <div class="sheet-actions">${role === 'host' && V.phase === 'over' ? '<button class="btn" type="button" id="mLobby">Back to lobby</button>' : ''}<button class="btn primary" type="button" data-close>Close</button></div>`);
}
function openLeave() {
  const msg = role === 'host' ? 'This closes the room for everyone in it.' : role === 'guest' ? 'The computer moves for you while you are gone. You can rejoin with the same code and name.' : 'Your game is saved. You can continue it from the start screen.';
  openModal(`<h2>${role === 'host' ? 'Close the <span>room</span>?' : role === 'guest' ? 'Leave the <span>room</span>?' : 'Quit to the <span>start screen</span>?'}</h2>
    <p class="lede">${msg}</p>
    <div class="sheet-actions"><button class="btn" type="button" data-close>Stay</button><button class="btn primary" type="button" id="mLeave">${role === 'host' ? 'Close room' : role === 'guest' ? 'Leave' : 'Quit to start screen'}</button></div>`);
}

/* ================= starting things ================= */
function readName() {
  const v = ($('hName').value || '').trim().slice(0, 14);
  if (!v) { homeMsg = 'Type your name first.'; homeErr = true; renderHome(); $('hName').focus(); return false; }
  myName = v; setItem(LS, 'ck-name', v);
  return true;
}
function startSolo() {
  if (!readName()) return;
  const level = $('hLevel').value;
  setItem(LS, 'ck-level', level);
  role = 'solo'; S = baseState('solo', level); animInit = false;
  S.players.push(newPlayer(me, myName, false));
  S.players.push(newPlayer('bot-' + rid(), BOT_NAMES[level], true));
  newGame();
}
function continueSolo() {
  const s = getItem(LS, 'ck-solo');
  if (!s || s.v !== 1) return;
  role = 'solo'; S = s; S.hostId = me; animInit = false;
  const hp = S.players.find(p => !p.bot); if (hp) { hp.id = me; hp.online = true; }
  normalizeHost();
  changed();
}
function createRoom() {
  if (!readName()) return;
  if (waitNet(createRoom)) return;
  if (!netReady()) { homeMsg = "Couldn't load the connection tools. Check your internet and reload."; homeErr = true; renderHome(); return; }
  role = 'host'; roomCode = newCode(); hostSess = rid(); animInit = false;
  S = baseState('room', getItem(LS, 'ck-level'));
  S.players.push(newPlayer(me, myName, false));
  history.replaceState(null, '', '#' + roomCode);
  openHostPeer(); startHostRelay();
  changed();
}
function reopenRoom() {
  const g = getItem(LS, 'ck-host');
  if (!g || !g.S) return;
  if (!readName()) return;
  if (waitNet(reopenRoom)) return;
  if (!netReady()) { homeMsg = "Couldn't load the connection tools. Check your internet and reload."; homeErr = true; renderHome(); return; }
  role = 'host'; roomCode = g.code; hostSess = rid(); S = g.S; animInit = false;
  const hp = S.players.find(p => p.id === S.hostId) || S.players.find(p => !p.bot);
  if (hp) { hp.id = me; hp.name = myName; }
  S.hostId = me;
  history.replaceState(null, '', '#' + roomCode);
  openHostPeer(); startHostRelay();
  normalizeHost();
  changed();
}
function joinFromForm() {
  if (!readName()) return;
  const code = ($('hCode').value || '').toUpperCase().replace(/[^A-Z]/g, '');
  if (code.length !== 4) { homeMsg = 'Room codes are 4 letters.'; homeErr = true; renderHome(); return; }
  if (waitNet(joinFromForm)) return;
  if (!netReady()) { homeMsg = "Couldn't load the connection tools. Check your internet and reload."; homeErr = true; renderHome(); return; }
  history.replaceState(null, '', '#' + code);
  animInit = false;
  joinRoom(code);
}

/* ================= events ================= */
$('hSolo').addEventListener('click', startSolo);
$('hContinue').addEventListener('click', () => { if (readName()) continueSolo(); });
$('hCreate').addEventListener('click', createRoom);
$('hReopen').addEventListener('click', reopenRoom);
$('joinForm').addEventListener('submit', e => { e.preventDefault(); joinFromForm(); });
$('hRules').addEventListener('click', openRules);
$('hName').addEventListener('input', () => { if (homeErr) { homeMsg = ''; homeErr = false; $('homeMsg').textContent = ''; } });
$('hLevel').value = DEPTH[getItem(LS, 'ck-level')] ? getItem(LS, 'ck-level') : 'medium';

$('lAddBot').addEventListener('click', () => act('addBot'));
$('lStart').addEventListener('click', () => act('start'));
$('lLevel').addEventListener('change', e => { setItem(LS, 'ck-level', e.target.value); act('settings', { level: e.target.value }); });
$('lPlayers').addEventListener('click', e => { const b = e.target.closest('[data-remove]'); if (b) act('remove', { id: b.dataset.remove }); });
$('lRules').addEventListener('click', openRules);
$('lLeave').addEventListener('click', openLeave);
$('lCopy').addEventListener('click', () => {
  const link = shareLink(), msg = $('lCopyMsg');
  const done = t => { msg.textContent = t; setTimeout(() => { msg.textContent = ''; }, 2500); };
  if (navigator.share) {
    navigator.share({ title: 'Checkers', text: `Play Checkers with me. Code: ${roomCode}`, url: link }).catch(() => {});
    return;
  }
  const pick = () => { const r = document.createRange(); r.selectNodeContents($('lLink')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); done('Link selected. Copy it from here.'); };
  try { navigator.clipboard.writeText(link).then(() => done('Link copied. Send it to your friend.'), pick); } catch (e) { pick(); }
});

$('board').addEventListener('click', e => {
  const sq = e.target.closest('.sq');
  if (!sq || sq.disabled || !myTurn()) return;
  const i = +sq.dataset.i;
  const moves = legalMoves(V.board, V.me);
  if (sel != null) {
    const m = moves.find(x => x.f === sel && x.path[x.path.length - 1] === i);
    if (m) { sel = null; act('move', { f: m.f, path: m.path }); if (role === 'guest') renderGame(); return; }
  }
  if (moves.some(x => x.f === i)) { sel = sel === i ? null : i; renderGame(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('modal').hidden) { closeModal(); return; }
});
$('btnNext').addEventListener('click', () => act('next'));
$('btnRules').addEventListener('click', openRules);
$('btnScores').addEventListener('click', openScores);
$('btnLeave').addEventListener('click', openLeave);
$('btnMenu').addEventListener('click', () => {
  openModal(`<h2>Menu</h2>
    <div class="menu-list">
      <button class="btn" type="button" id="mmRules">Rules</button>
      <button class="btn" type="button" id="mmScores">Score</button>
      <button class="btn" type="button" id="mmLeave">${role === 'host' ? 'Close room' : role === 'guest' ? 'Leave room' : 'Quit to start screen'}</button>
    </div>
    <div class="sheet-actions"><button class="btn primary" type="button" data-close>Back to the game</button></div>`);
});
$('modal').addEventListener('click', e => {
  if (e.target === $('modal') || e.target.closest('[data-close]')) closeModal();
  else if (e.target.closest('#mmRules')) openRules();
  else if (e.target.closest('#mmScores')) openScores();
  else if (e.target.closest('#mmLeave')) openLeave();
  else if (e.target.closest('#mLobby')) { closeModal(); act('lobby'); }
  else if (e.target.closest('#mLeave')) {
    closeModal();
    if (role === 'solo') { token++; clearTimeout(timer); role = null; S = null; V = null; homeMsg = ''; homeErr = false; render(); }
    else leave();
  }
});
window.addEventListener('pagehide', () => { if (role === 'guest' && hostConn && hostConn.open) { try { hostConn.send({ t: 'away' }); } catch (e) { /* skip */ } } });
window.addEventListener('beforeunload', e => { if (role === 'host' && conns.size) { e.preventDefault(); e.returnValue = ''; } });

/* ================= boot ================= */
(function boot() {
  const hashCode = (location.hash || '').replace('#', '').toUpperCase().replace(/[^A-Z]/g, '');
  if (hashCode.length === 4) $('hCode').value = hashCode;
  const savedGuest = getItem(LS, 'ck-guest');
  const savedHost = getItem(LS, 'ck-host');
  render();
  if (!onlineOK) return;
  NET.then(() => {
    if (role) return;
    if (myName && savedHost && savedHost.code && hashCode === savedHost.code && netReady()) { reopenRoom(); return; }
    if (myName && savedGuest && savedGuest.code && (!hashCode || hashCode === savedGuest.code) && netReady()) { joinRoom(savedGuest.code); return; }
    if (hashCode.length === 4) { homeMsg = myName ? `Tap Join room to join room ${hashCode}.` : `Type your name, then tap Join room to join room ${hashCode}.`; renderHome(); }
  });
})();
})();
</script>
